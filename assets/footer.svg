<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
<title id="title">thanks for swimming by</title>
<desc id="desc">Footer: &quot;thanks for swimming by — see you at sea&quot; above rolling waves, with a sea otter drifting past.</desc>
<style>
.mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

.swim { animation: swim 22s linear -9s infinite; }
@keyframes swim { from { transform: translateX(-180px); } to { transform: translateX(940px); } }
.bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(2deg); } }
.beat { animation: beat 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
