name: daily header + tide log

on:
  schedule:
    - cron: '5 17 * * *' # 00:05 in Bangkok, so the season and birthday countdown flip at local midnight
    - cron: '5 5 * * *'  # and a midday refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw the seasonal header and the tide log
        run: |
          node scripts/header.mjs --out dist/header.svg
          node scripts/contributions.mjs --out dist/contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMEZONE: Asia/Bangkok

      # The generated cards live alone on an `output` branch so main's history stays clean.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.svg contributions.svg
          git commit -q -m "daily cards $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
